[project]
name = "chatty-agent-common"
# Fixed artifact version — agents vendor by PEP 427 filename; content is the source of truth (git).
version = "0.0.0"
description = "Shared Chatty agent helpers (handoff, scoring, providers, skills) — local path dep only"
authors = [
    {name = "Innovatica", email = "dev@innovatica.co"},
]
dependencies = [
    "google-adk[gcp]>=2.8.0,<3.0.0",
    "google-genai>=2.9,<3.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "supabase>=2.30.0,<3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0,<3.0.0",
    "typing-extensions>=4.12.0",
    "sentry-sdk>=2.0,<3.0.0",
]
requires-python = ">=3.12,<3.14"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "C",
    "B",
    "UP",
    "RUF",
]
ignore = ["E501", "C901", "B006"]

[tool.ruff.lint.isort]
known-first-party = ["chatty_agent_common"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
